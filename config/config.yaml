agents:
  analysts:
  - technical
  - sentiment
  - news
  - fundamentals
  - capital
  api_key_env: DEEPSEEK_API_KEY
  base_url: https://api.deepseek.com
  confidence_threshold: 0.6
ai:
  api_key_env: DEEPSEEK_API_KEY
  base_url: https://api.deepseek.com
  confidence_threshold: 0.55
  decision_interval: 30
  enabled: false
  model: deepseek-chat
  provider: deepseek
  temperature: 0.2
  use_openbb: false
alerts:
  large_change_pct: 5
  limit_down_pct: -9.8
  limit_up_pct: 9.8
  volume_surge_ratio: 3
approval:
  audit_log_limit: 200
  dashboard_signal_refresh_seconds: 300
  max_price_drift_pct: 1.5
  max_signal_age_seconds: 1800
  min_buy_confidence: 0.58
  min_data_quality_score: 70
  min_risk_reward: 1.35
  min_validation_avg_return: 0
  min_validation_samples: 3
  min_validation_win_rate: 45
  validation_cache_seconds: 1800
autotrade:
  buy_score: 60
  decision_interval: 300
  deep_think_model: deepseek-chat
  enabled: false
  max_debate_rounds: 1
  max_positions: 6
  min_confidence: 0.55
  min_keep_positions: 2
  min_risk_reward: 1.5
  provider: deepseek
  quick_think_model: deepseek-chat
  target_position_pct: 1.0
  temperature: 0.3
  use_memory: true
  # 保护机制 (借鉴 Freqtrade Protections)
  protections:
    cooldown_days: 3            # 卖出后同股冷却天数 (防反复接刀)
    stoploss_lookback_days: 5   # 连亏熔断滚动窗口
    stoploss_max_count: 2       # 窗口内止损≥此次数触发熔断
    stoploss_pause_days: 2      # 熔断暂停开仓天数
    max_drawdown_pct: 0.08      # 组合自峰值回撤超此比例暂停新开仓
    trail_activate_pct: 0.04    # 浮盈达4%后启用追踪止盈
    trail_drawdown_pct: 0.03    # 自持仓最高点回撤3%离场
    atr_risk_pct: 0.01          # ATR仓位: 单笔风险占组合1%
    atr_stop_mult: 2.0          # 止损距离 = ATR×2
    min_hold_days: 2            # 非硬风险信号的最短持有天数 (防买入次日即卖)
    loss_streak_cooldown_mult: 2.0  # 同股连亏时冷却期倍数 (茅台反复3次全亏的归因)
  # 全市场选股漏斗 (第一级粗筛, 便宜; 精筛仍走 _autotrade_buy_screen)
  prefilter:
    min_amount: 100000000       # 成交额下限 1亿 (流动性门槛)
    min_turnover: 1.0           # 换手率下限 %
    max_turnover: 20.0          # 换手率上限 % (过高=情绪过热/出货)
    min_float_mktcap_yi: 50.0   # 流通市值下限 (亿, 剔微盘)
    max_float_mktcap_yi: 5000.0 # 流通市值上限 (亿, 剔超大盘)
    min_change_pct: -5.0        # 当日跌幅下限 (防接飞刀)
    max_change_pct: 9.0         # 当日涨幅上限 (防追涨停/追高)
    min_price: 3.0              # 股价下限 (剔仙股)
    max_price: 300.0            # 股价上限
    page_size: 100              # 单页条数
    max_pages: 3                # 翻页数 (3×100=300只快照)
    max_candidates: 60          # 粗筛后交给精筛的候选数
